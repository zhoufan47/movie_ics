name: 更新豆瓣电影日历

on:
  schedule:
    # 每月7日 UTC 00:00 执行（北京时间 08:00）
    - cron: '0 0 7 * *'
  workflow_dispatch:
    # 允许手动触发执行

permissions:
  contents: write

jobs:
  update-calendar:
    name: 抓取电影数据并生成 ICS
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 执行数据抓取脚本
        run: python main.py

      - name: 提交并推送数据更新
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: 更新电影日历数据'
          file_pattern: 'data/**/*.ics data/*.ics'
          branch: main
